; Version generated: 2026-09-25 19:19:20 CEST (Europe/Berlin)
[platformio]
default_envs = adafruit_matrixportal_esp32s3

[env:adafruit_matrixportal_esp32s3]
platform = espressif32 @ 7.1.3
board = adafruit_matrixportal_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -DFLIGHTWALL_HAS_MATRIX=1
lib_deps =
    https://github.com/adafruit/Adafruit_Protomatter.git#0f51ca2347479228d8cb96fd3f410b032fe6dbad
    adafruit/Adafruit GFX Library @ 1.12.6
    adafruit/Adafruit BME280 Library @ 2.3.0
    bblanchon/ArduinoJson @ 7.4.3
    knolleary/PubSubClient @ 2.8.0

[env:adafruit_matrixportal_esp32s3_ota]
extends = env:adafruit_matrixportal_esp32s3
upload_protocol = espota
upload_port = matrixportal.local
upload_flags =
    --auth=${sysenv.MATRIXPORTAL_OTA_PASSWORD}
    --timeout=30

[env:esp32s3_n16r8_headless]
platform = espressif32 @ 7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    -DFLIGHTWALL_HAS_MATRIX=0
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit GFX Library @ 1.12.6
    adafruit/Adafruit BME280 Library @ 2.3.0
    bblanchon/ArduinoJson @ 7.4.3
    knolleary/PubSubClient @ 2.8.0

[env:esp32s3_n16r8_headless_ota]
extends = env:esp32s3_n16r8_headless
upload_protocol = espota
upload_port = flightwall-server.local
upload_flags =
    --auth=${sysenv.MATRIXPORTAL_OTA_PASSWORD}
    --timeout=30
