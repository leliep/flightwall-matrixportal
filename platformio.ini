[platformio]
default_envs = adafruit_matrixportal_esp32s3

[env:adafruit_matrixportal_esp32s3]
platform = espressif32 @ 7.1.3
board = adafruit_matrixportal_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit Protomatter @ 1.7.1
    adafruit/Adafruit GFX Library @ 1.12.6
    adafruit/Adafruit BME280 Library @ 2.3.0
    bblanchon/ArduinoJson @ 7.4.3
    knolleary/PubSubClient @ 2.8.0

[env:adafruit_matrixportal_esp32s3_ota]
extends = env:adafruit_matrixportal_esp32s3
upload_protocol = espota
upload_port = matrixportal.local
upload_flags =
    --auth=${sysenv.MATRIXPORTAL_OTA_PASSWORD}
